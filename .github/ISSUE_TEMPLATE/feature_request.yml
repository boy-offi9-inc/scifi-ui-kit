name: Feature request
description: Suggest a change or a new component
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe your screen or use case, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like SciFiKit to do?
      description: Sketches, screenshots or reference links are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
